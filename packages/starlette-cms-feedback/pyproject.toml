[project]
name = "starlette-cms-feedback"
version = "0.1.0"
description = "Feedback and bug reports for starlette-cms — an admin page, HTTP API and MCP tools"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joel Lithgow" }]
requires-python = ">=3.12"
keywords = ["starlette", "cms", "feedback", "bug-reports", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "starlette-cms>=0.5.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
full = ["starlette-cms-feedback[mcp]"]
dev = ["starlette-cms-feedback[full]"]

[project.urls]
Homepage = "https://github.com/ASneakyToast/astraeus"
Repository = "https://github.com/ASneakyToast/astraeus"
Issues = "https://github.com/ASneakyToast/astraeus/issues"

[tool.uv.sources]
starlette-cms = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starlette_cms_feedback"]
