[project]
name = "starlette-chat"
version = "0.1.0"
description = "Governed AI chat collaborator for Astraeus"
requires-python = ">=3.12"
dependencies = [
    "starlette-cms>=0.5.0",
    "starlette>=0.40",
    "httpx>=0.27",
    "structlog>=24.0",
    "mistune>=3.0",
    "websockets>=13.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
anthropic    = ["langchain-anthropic>=0.3"]
openai       = ["langchain-openai>=0.2"]
full         = ["starlette-chat[anthropic,openai]"]
session-db   = ["aiosqlite>=0.20"]
dev          = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "respx>=0.21", "aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starlette_chat"]

[tool.uv.sources]
starlette-cms = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
