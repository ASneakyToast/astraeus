[project]
name = "starlette-chat"
version = "0.1.0"
description = "Governed AI chat collaborator for Astraeus"
requires-python = ">=3.12"
dependencies = [
    "starlette-cms>=0.5.0",
    "starlette>=0.40",
    "httpx>=0.27",
    "structlog>=24.0",
    "mistune>=3.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai    = [
    "openai>=1.0",
]
full      = ["starlette-chat[anthropic,openai]"]
dev       = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starlette_chat"]

[tool.uv.sources]
starlette-cms = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
