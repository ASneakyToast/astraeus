[project]
name = "astraeus-portal"
version = "0.1.0"
description = "Central navigation hub (portal) for Astraeus — discover and navigate all admin interfaces"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joel Lithgow" }]
requires-python = ">=3.12"
keywords = ["starlette", "astraeus", "portal", "admin", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "starlette>=0.40",
    "structlog>=24.0",
]

[project.optional-dependencies]
compose = [
    "starlette-cms>=0.5.0",
]
full = ["astraeus-portal[compose]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ASneakyToast/astraeus"
Repository = "https://github.com/ASneakyToast/astraeus"
Issues = "https://github.com/ASneakyToast/astraeus/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astraeus_portal"]

[tool.uv.sources]
starlette-cms = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"