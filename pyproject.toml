[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.20",
    "ruff>=0.6",
    "pyright>=1.1",
    "mkdocs-material>=9.5",
    # Three packages ship an MCP server behind an [mcp] extra and test it.
    # The workspace dev environment never installed it, so those tests have
    # never run here — they errored on import and were counted as expected
    # failures for months.
    "mcp>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
